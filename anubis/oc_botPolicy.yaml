## Anubis has the ability to let you import snippets of configuration into the main
## configuration file. This allows you to break up your config into smaller parts
## that get logically assembled into one big file.
##
## Of note, a bot rule can either have inline bot configuration or import a
## bot config snippet. You cannot do both in a single bot rule.
##
## Import paths can either be prefixed with (data) to import from the common/shared
## rules in the data folder in the Anubis source tree or will point to absolute/relative
## paths in your filesystem. If you don't have access to the Anubis source tree, check
## /usr/share/docs/anubis/data or in the tarball you extracted Anubis from.

bots:

- name: oc-home-page
  path_regex: ^/$
  action: ALLOW

- name: rsl
  path_regex: ^/rsl.xml
  action: ALLOW

- name: well_known_ok
  path_regex: ^/.well-known/.*$
  action: ALLOW

- name: oc-ezid
  user_agent_regex: ezid
  action: ALLOW

- name: oc-ezid-uc
  user_agent_regex: EZID
  action: ALLOW

- name: oc-cc-bot
  user_agent_regex: CCBot
  action: ALLOW

- name: "oc-ok-bots"
  user_agent_regex: >-
    CCBot|EZID
  action: ALLOW

# Pathological bots to deny
- # This correlates to data/bots/deny-pathological.yaml in the source tree
  # https://github.com/TecharoHQ/anubis/blob/main/data/bots/deny-pathological.yaml
  import: (data)/bots/_deny-pathological.yaml
- import: (data)/bots/aggressive-brazilian-scrapers.yaml

# Enforce https://github.com/ai-robots-txt/ai.robots.txt
- import: (data)/bots/ai-robots-txt.yaml

# Search engine crawlers to allow, defaults to:
#   - Google (so they don't try to bypass Anubis)
#   - Bing
#   - DuckDuckGo
#   - Qwant
#   - The Internet Archive
#   - Kagi
#   - Marginalia
#   - Mojeek
- import: (data)/crawlers/_allow-good.yaml

# Allow common "keeping the internet working" routes (well-known, favicon, robots.txt)
- import: (data)/common/keep-internet-working.yaml

# # Punish any bot with "bot" in the user-agent string
# # This is known to have a high false-positive rate, use at your own risk
# - name: generic-bot-catchall
#   user_agent_regex: (?i:bot|crawler)
#   action: CHALLENGE
#   challenge:
#     difficulty: 16  # impossible
#     report_as: 4    # lie to the operator
#     algorithm: slow # intentionally waste CPU cycles and time


# Eric added Open Context specific rules
- name: deny-env
  action: DENY
  expression:
    all:
    - 'path == "/.env"'

- name: "oc-ok-bots-2"
  user_agent_regex: >-
    CCBot|EZID
  action: ALLOW

- name: oc-browser-samsung
  user_agent_regex: Samsung
  action: ALLOW

- name: allow-api-json-routes
  action: ALLOW
  expression:
    all:
    - '!(method == "HEAD" || method == "GET")'
    - path.contains(".json")

- name: oc-api-client
  user_agent_regex: oc-api-client
  action: ALLOW

# OC-API client second match
- name: oc-api-client-2
  expression: userAgent.contains("oc-api")
  action: ALLOW

# OAI-PMH client
- name: oai-pmh-client
  expression: userAgent.contains("oai")
  action: ALLOW

# Path-based ALLOW rules - must come before generic browser CHALLENGE rules
- name: oc-map-projects-allow
  action: ALLOW
  expression:
    any:
    - 'path.contains("/map-projects")'
    - 'path == "/map-projects.json"'

# Path-based ALLOW rules - must come before generic browser CHALLENGE rules
- name: oc-highlights-allow
  action: ALLOW
  expression:
    any:
    - 'path.contains("/highlights/")'
    - 'path == "/highlights"'

# Path-based ALLOW rules - must come before generic browser CHALLENGE rules
- name: oc-highlights-api-allow
  action: ALLOW
  expression:
    all:
    - 'path.contains("/query")'
    - '"proj-summary" in query'

- name: oc-about-allow
  action: ALLOW
  expression:
    any:
    - 'path.contains("/about/")'
    - 'path == "/about"'

- name: oc-projects-index-allow
  action: ALLOW
  expression:
    any:
    - 'path.contains("/projects-index/")'
    - 'path == "/projects-index"'

- name: oc-projects-allow
  action: ALLOW
  expression:
    any:
    - 'path.contains("/projects/")'
    - 'path == "/projects"'

# Generic catchall Mozilla rule
- name: generic-browser-mozilla
  user_agent_regex: Mozilla
  action: CHALLENGE

# Generic catchall Opera rule
- name: generic-browser-opera
  user_agent_regex: Opera
  action: CHALLENGE

# Generic catchall Chrome rule
- name: generic-browser-chrome
  user_agent_regex: Chrome
  action: CHALLENGE

# Generic catchall Safari rule
- name: generic-browser-safari
  user_agent_regex: Safari
  action: CHALLENGE

# Generic catchall curl rule
- name: generic-browser-curl
  user_agent_regex: curl
  action: CHALLENGE

# Generic catchall no user agent rule
- name: no-user-agent-string
  expression: userAgent == ""
  action: DENY

# Generic catchall rule
- name: generic-browser
  user_agent_regex: >-
    Mozilla|Opera
  action: CHALLENGE

dnsbl: false

# By default, send HTTP 200 back to clients that either get issued a challenge
# or a denial. This seems weird, but this is load-bearing due to the fact that
# the most aggressive scraper bots seem to really, really, want an HTTP 200 and
# will stop sending requests once they get it.
status_codes:
  CHALLENGE: 200
  DENY: 200 
